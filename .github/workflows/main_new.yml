name: Greetings

on:
  workflow_dispatch:
  issues:
  pull_request_target:

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Test run for manual trigger
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "✅ Manual trigger successful — workflow is running fine."

      - name: Run first-interaction action
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Hello! This is your first issue."
          pr-message: "Hi! Thanks for your first PR."
